# Todo lo que cambia de un dominio a otro vive aqui, no en el codigo.
# Para pasar de seguros a otra cosa: cambia los PDFs de `documentos/`,
# este archivo y las preguntas de `evaluacion/`.

dominio: seguros
descripcion: >
  Condiciones generales de polizas de seguro y normativa del contrato de seguro.

carpeta_documentos: documentos
carpeta_indice: indice          # aqui se guardan los vectores ya calculados

# Embeddings: 'gemini' (API) o 'local' (se ejecuta en tu ordenador; los documentos
# no salen de el. Requiere: pip install sentence-transformers)
proveedor_embeddings: local
modelo_embeddings: gemini-embedding-001
modelo_embeddings_local: intfloat/multilingual-e5-base
# Version exacta del modelo (commit en Hugging Face): mismos vectores siempre
revision_modelo_local: d128750597153bb5987e10b1c3493a34e5a4502a

modelo_generacion: gemini-flash-lite-latest

# Troceado (en caracteres)
tamano_trozo: 900
solapamiento: 150

# Cuantos fragmentos se recuperan por pregunta
k: 5

# Busqueda: 'denso' (embeddings), 'bm25' (palabras clave) o 'hibrido' (los dos).
# El hibrido fue el mejor en la evaluacion (ver evaluacion/RESULTADOS.md).
modo_busqueda: hibrido

# Antepone el nombre del documento al texto de cada fragmento al indexarlo.
prefijo_fuente: true

# Opcional: regex que marca el inicio de una seccion para no mezclar articulos en
# un mismo fragmento. Depende del tipo de documento, por eso no va activado.
# Ejemplo para leyes: separador_estructura: 'Art[ií]culo [a-záéíóú]+\. '
# separador_estructura:
